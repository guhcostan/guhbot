name: Verify
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.9.0
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @guhbot/browser exec playwright-core install --with-deps chromium
      - run: pnpm test
      - run: pnpm typecheck
      - run: pnpm --filter @guhbot/desktop build
      - run: pnpm --filter @guhbot/desktop typecheck
      - run: pnpm --filter @guhbot/mobile typecheck
      - run: pnpm --filter @guhbot/cloud build
      - run: pnpm --filter @guhbot/mobile exec expo export --platform ios --output-dir /tmp/guhbot-ios-export
      - run: docker build -t guhbot:ci .
      - run: docker run --rm guhbot:ci packages/server/dist/cli.js --help
      - run: pnpm --dir deploy/aws install --frozen-lockfile
      - run: pnpm --dir deploy/aws synth
